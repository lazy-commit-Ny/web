<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple 製品についての紹介サイト</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; background-color: #E8DCcc; color: #333; line-height: 1.7; margin: 0; }
        #container { max-width: 1040px; margin: 0 auto; padding: 0 20px; }
        #content { display: flex; gap: 24px; padding-top: 40px; }
        #main { flex: 1; background: #fff; border-radius: 12px; padding: 30px; }
        #box2 { width: 300px; }
        .hatena-module { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        #footer-menu { text-align: center; padding: 15px 0; font-size: 14px; color: #666; margin-top: 30px; border-top: 1px dashed rgba(0,0,0,0.1); }
        #footer-menu a { color: #333; text-decoration: none; margin: 0 5px; }
        .simple-cookie-banner { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(34,34,34,0.95); color: #fff; padding: 10px 20px; z-index: 99999; box-sizing: border-box; }
        .simple-cookie-content { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .btn-simple { padding: 6px 16px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; }
        .btn-simple-accept { background: #007bff; color: #fff; }
        .btn-simple-reject { background: #555; color: #fff; }
    </style>
</head>
<body>
<div id="container">
    <div id="content">
        <main id="main">
            <h1>Apple 製品についての紹介サイト</h1>
            <p>iPhone、Mac、iPadなどのApple製品情報ブログ。</p>
        </main>
        <div id="box2">
            <div class="hatena-module">
                <h2>プロフィール</h2>
                <p>管理人：toukyo</p>
            </div>
        </div>
    </div>
    
    <div id="footer-menu">
        | <a href="https://iphoneapple.hatenablog.com/">TOP</a> 
        | <a href="https://hatenablog.com">iPhone</a> 
        | <a href="https://iphoneapple.hatenablog.com/archive/category/Appleイベント">Appleイベント</a> 
        | <a href="https://iphoneapple.hatenablog.com/archive/category">カテゴリー</a> 
        | <a href="https://iphoneapple.hatenablog.com/entry/profile">運営者情報</a> 
        | <a href="https://iphoneapple.hatenablog.com/entry/%E8%A6%8F%E7%B4%84">サイトのご利用にあたって</a> 
        | <a href="https://iphoneapple.hatenablog.com/entry/%E3%83%97%E3%83%A9%E3%82%A4%E3%83%90%E3%82%B7%E3%83%BC%E3%83%9D%E3%83%AA%E3%82%B7%E3%83%BC">プライバシーポリシー</a> 

        | <a href="https://iphoneapple.hatenablog.com/entry/%E3%81%8A%E5%95%8F%E3%81%84%E5%90%88%E3%82%8F%E3%81%9B">お問い合わせ</a> |
    </div>

    <footer style="text-align: center; padding: 20px;">
        <p>&copy; 2026 Apple 製品についての紹介サイト. All Rights Reserved.</p>
    </footer>

    <div id="simple-cookie-banner" class="simple-cookie-banner" style="display: none;">
        <div class="simple-cookie-content">
            <p style="font-size: 13px; margin: 0;">当サイトではCookie等を使用しています。詳細はプライバシーポリシーをご確認ください。</p>
            <div>
                <button class="btn-simple btn-simple-reject" id="simple-consent-reject">同意しない</button>
                <button class="btn-simple btn-simple-accept" id="simple-consent-accept">同意する</button>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    if (!localStorage.getItem('user-cookie-consent')) {
        document.getElementById('simple-cookie-banner').style.display = 'block';
    }
    document.getElementById('simple-consent-accept').addEventListener('click', () => {
        localStorage.setItem('user-cookie-consent', 'accepted');
        document.getElementById('simple-cookie-banner').remove();
    });
    document.getElementById('simple-consent-reject').addEventListener('click', () => {
        if (confirm('本当にいいのですか？')) {
            window.close();
            setTimeout(() => { window.location.href = 'about:blank'; }, 100);
        }
    });
});
</script>
</body>
</html>
